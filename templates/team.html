<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Team - CyberSec</title>
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-troika-text@0.10.0/dist/aframe-troika-text.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            position: fixed;
            width: 100%;
            height: 100%;
        }
        
        /* Фикс для AR.js видео на мобильных устройствах */
        a-scene {
            position: fixed !important;
            top: 0;
            left: 0;
            width: 100% !important;
            height: 100% !important;
        }
        
        .a-canvas {
            position: fixed !important;
            top: 0;
            left: 0;
            width: 100% !important;
            height: 100% !important;
        }
        
        /* Стили для видео элемента AR.js */
        video {
            position: fixed !important;
            top: 50% !important;
            left: 50% !important;
            min-width: 100% !important;
            min-height: 100% !important;
            width: auto !important;
            height: auto !important;
            transform: translate(-50%, -50%) !important;
            object-fit: cover !important;
        }
        
        .info-panel {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: #00ff88;
            padding: 15px;
            border-radius: 10px;
            z-index: 999;
            max-width: 300px;
        }
        
        .info-panel h3 {
            margin: 0 0 10px 0;
        }
        
        .info-panel p {
            margin: 5px 0;
            font-size: 14px;
        }
        
        .info-panel a {
            color: #00ff88;
            text-decoration: underline;
        }
        
        /* Адаптация для мобильных устройств */
        @media (max-width: 768px) {
            .info-panel {
                max-width: 200px;
                padding: 10px;
                font-size: 12px;
            }
            
            .info-panel h3 {
                font-size: 14px;
            }
            
            .info-panel p {
                font-size: 11px;
            }
        }
    </style>
    <script>
        // Фикс для видео на мобильных устройствах
        window.addEventListener('load', function() {
            setTimeout(function() {
                const video = document.querySelector('video');
                if (video) {
                    video.style.width = '100%';
                    video.style.height = '100%';
                    video.style.objectFit = 'cover';
                    video.style.position = 'fixed';
                    video.style.top = '0';
                    video.style.left = '0';
                    console.log('Видео настроено для мобильного устройства');
                }
            }, 1000);
        });
        
        // Дополнительная проверка при загрузке AR
        document.addEventListener('camera-init', function() {
            const video = document.querySelector('video');
            if (video) {
                video.style.width = '100%';
                video.style.height = '100%';
                video.style.objectFit = 'cover';
            }
        });
    </script>
</head>
<body>
    <div class="info-panel">
        <h3>🎯 AR</h3>
        <p>Наведите камеру на маркер Hiro</p>
        <p><a href="https://raw.githubusercontent.com/AR-js-org/AR.js/master/data/images/hiro.png" target="_blank">📥 Скачать маркер</a></p>
        <p style="font-size: 12px; color: #666; margin-top: 10px;">Разрешите доступ к камере</p>
    </div>


    <!-- embedded 
        arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false; sourceWidth:640; sourceHeight:480; displayWidth: 640; displayHeight: 480;"
        vr-mode-ui="enabled: false"
        renderer="logarithmicDepthBuffer: true; precision: medium; antialias: true; alpha: true;" -->

    <a-scene embedded arjs vr-mode-ui="enabled: false">
        <a-marker preset="custom" type="pattern" url="/static/markers/memory.patt">
        <!-- <a-marker preset="hiro"> -->
            <!-- Карточка члена команды -->
            <a-entity position="0 0 0" rotation="-90 0 0" scale="1 1 1">

  <!-- 1) Фон карточки: используем SVG data-URI (скруглённые углы + красная обводка) -->
  <!-- Размеры svg подобраны под ширину/высоту плоскости: мы используем width=1.8 height=1.0 -->
  <a-plane
    id="card-bg"
    position="0 0 0"
    width="3.0"
    height="2.0"
    material="src: url(/static/materials/background.svg); shader: flat; side:double; transparent:true; opacity:1; alphaTest: 0.05;"
    shadow>
  </a-plane>

  <!-- 2) Фото (справа & чуть выше центра, на небольшом слое впереди) -->
  <a-image
    id="photo"
    src="/static/images/team/cipher.svg"
    position="-0.75 0.02 0.02"
    width="0.72"
    height="0.72"
    material="shader: standard; roughness: 0.4; metalness: 0.15;"
    class="no-pointer"
    shadow>
  </a-image>

  <a-entity
    id="name"
    troika-text="value: Грищенко Владислав; font: /static/fonts/Exo2.ttf; color: #ff4040; fontSize: 0.14; maxWidth: 1.5; anchor: center; lineHeight: 1.1;"
    position="0 0.55 0.02">
  </a-entity>

  <a-entity position="-0.25 0.3 0.02">
    <a-entity
      id="role"
      troika-text="value: Security Engineer; font: /static/fonts/Exo2.ttf; color: #ff8080; fontSize: 0.12; maxWidth: 1.1; anchor: left; lineHeight: 1.1;"
      position="0 0 0">
    </a-entity>

    <a-entity
      id="desc"
      troika-text="value: Пентестер и аналитик по кибербезопасности. Специализируется на веб-уязвимостях и реагировании на инциденты.; font: /static/fonts/Exo2.ttf; color: #dddddd; fontSize: 0.095; maxWidth: 1.4; anchor: left; lineHeight: 1.25; whiteSpace: normal;"
      position="0 -0.5 0">
    </a-entity>
  </a-entity>

  <!-- Плавное появление всей карточки -->
  <a-animation attribute="scale" from="0 0 0" to="1 1 1" dur="700" easing="ease-out"></a-animation>
</a-entity>

        </a-marker>
        
        <a-entity camera></a-entity>
    </a-scene>

    <script>
  (function () {
    // Ждём загрузки сцены A-Frame
    window.addEventListener('load', () => {
      const sceneEl = document.querySelector('a-scene');
      if (!sceneEl) return;

      // Получаем рендерер/камера/DOM canvas
      // (на AR.js камера может быть внутри sceneEl.cameraEl)
      const trySetup = () => {
        const renderer = sceneEl.renderer;
        const cameraEl = sceneEl.camera || sceneEl.cameraEl;
        const camera = (cameraEl && cameraEl.components && cameraEl.components.camera)
                       ? cameraEl.components.camera.camera
                       : (sceneEl.camera && sceneEl.camera.camera) ? sceneEl.camera.camera : null;
        if (!renderer || !camera) {
          return false;
        }

        const dom = renderer.domElement;
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        // Собираем объекты, по которым клик возможен
        const clickableEls = Array.from(sceneEl.querySelectorAll('.clickable'));
        const meshObjects = () => {
          const arr = [];
          clickableEls.forEach(el => {
            const mesh = el.getObject3D && el.getObject3D('mesh');
            if (mesh) arr.push(mesh);
          });
          return arr;
        };

        const openGoogle = () => window.open('https://google.com', '_blank');

        // Обработчик касания/клика (работает и на ПК, и на мобильных)
        const handlePointer = (event) => {
          event.preventDefault();

          // Поддержка touch и mouse
          const rect = dom.getBoundingClientRect();
          let clientX, clientY;
          if (event.touches && event.touches.length > 0) {
            clientX = event.touches[0].clientX;
            clientY = event.touches[0].clientY;
          } else {
            clientX = event.clientX;
            clientY = event.clientY;
          }

          // Нормализуем координаты в [-1,1]
          mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
          mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;

          raycaster.setFromCamera(mouse, camera);

          // Получаем все трехмерные объекты для проверки пересечения
          const objects = meshObjects();
          if (objects.length === 0) return;

          const intersects = raycaster.intersectObjects(objects, true);
          if (intersects.length > 0) {
            // берём первый пересечённый объект -> ищем соответствующий a-image
            const hit = intersects[0].object;
            // из хит-объекта поднимаемся вверх по иерархии — ищем A-Frame элемент
            let aframeEl = null;
            clickableEls.forEach(el => {
              const mesh = el.getObject3D('mesh');
              if (!mesh) return;
              if (mesh === hit || mesh.children.includes(hit) || mesh.children.some(c => c === hit || c.children.includes(hit))) {
                aframeEl = el;
              }
            });

            if (aframeEl) {
              // временно открываем google.com (затем ты заменишь URL)
              openGoogle();
            }
          }
        };

        // Подписываемся и на touchstart, и на click — это повышает совместимость устройств
        dom.addEventListener('click', handlePointer, false);
        dom.addEventListener('touchstart', handlePointer, false);

        return true;
      };

      // Периодически пытаемся настроиться (AR.js инициализирует сцену немножко позже)
      const maxAttempts = 20;
      let attempts = 0;
      const timer = setInterval(() => {
        attempts++;
        if (trySetup() || attempts >= maxAttempts) {
          clearInterval(timer);
        }
      }, 250);
    });
  })();
</script>

</body>
</html>

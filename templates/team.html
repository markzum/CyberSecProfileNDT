    <script>
        AFRAME.registerComponent('team-card', {
            schema: {
                photo: { type: 'string', default: '/static/images/team/cipher.svg' },
                name: { type: 'string', default: 'Имя Фамилия' },
                role: { type: 'string', default: 'Роль' },
                description: { type: 'string', default: 'Описание специалиста' },
                textOffset: { type: 'vec3', default: { x: -0.25, y: 0.3, z: 0.02 } }
            },

            init: function () {
                this.createElements();
                this.updateCard();
            },

            update: function () {
                if (!this.cardBg) {
                    this.createElements();
                }
                this.updateCard();
            },

            createElements: function () {
                const el = this.el;

                this.cardBg = document.createElement('a-plane');
                this.cardBg.setAttribute('position', '0 0 0');
                this.cardBg.setAttribute('width', '3');
                this.cardBg.setAttribute('height', '2');
                this.cardBg.setAttribute('material', 'src: url(/static/materials/background.svg); shader: flat; side:double; transparent:true; opacity:1; alphaTest:0.05;');
                this.cardBg.setAttribute('shadow', '');
                el.appendChild(this.cardBg);

                this.photo = document.createElement('a-image');
                this.photo.setAttribute('position', '-0.75 0.02 0.05');
                this.photo.setAttribute('width', '0.72');
                this.photo.setAttribute('height', '0.72');
                this.photo.setAttribute('material', 'shader: standard; roughness: 0.4; metalness: 0.15;');
                this.photo.setAttribute('class', 'no-pointer');
                this.photo.setAttribute('shadow', '');
                el.appendChild(this.photo);

                this.name = document.createElement('a-entity');
                this.name.setAttribute('position', '0 0.55 0.02');
                el.appendChild(this.name);

                this.textGroup = document.createElement('a-entity');
                this.textGroup.setAttribute('position', '-0.25 0.3 0.02');
                el.appendChild(this.textGroup);

                this.role = document.createElement('a-entity');
                this.role.setAttribute('position', '0 0 0');
                this.textGroup.appendChild(this.role);

                this.desc = document.createElement('a-entity');
                this.desc.setAttribute('position', '0 -0.5 0');
                this.textGroup.appendChild(this.desc);

                this.animation = document.createElement('a-animation');
                this.animation.setAttribute('attribute', 'scale');
                this.animation.setAttribute('from', '0 0 0');

                const currentScale = this.el.getAttribute('scale');
                let targetScale = '1 1 1';

                if (currentScale) {
                    if (typeof currentScale === 'object') {
                        targetScale = `${currentScale.x} ${currentScale.y} ${currentScale.z}`;
                    } else {
                        targetScale = currentScale;
                    }
                }

                this.animation.setAttribute('to', targetScale);
                this.animation.setAttribute('dur', '700');
                this.animation.setAttribute('easing', 'ease-out');
                el.appendChild(this.animation);
            },

            updateCard: function () {
                const data = this.data;

                if (this.photo) {
                    this.photo.setAttribute('src', data.photo);
                }

                if (this.name) {
                    this.name.setAttribute('troika-text', `value: ${data.name}; font: /static/fonts/Exo2.ttf; color: #ff4040; fontSize: 0.14; maxWidth: 1.6; anchor: center; lineHeight: 1.1;`);
                }

                if (this.role) {
                    this.role.setAttribute('troika-text', `value: ${data.role}; font: /static/fonts/Exo2.ttf; color: #ff8080; fontSize: 0.12; maxWidth: 1.3; anchor: left; lineHeight: 1.1;`);
                }

                if (this.desc) {
                    this.desc.setAttribute('troika-text', `value: ${data.description}; font: /static/fonts/Exo2.ttf; color: #dddddd; fontSize: 0.095; maxWidth: 1.4; anchor: left; lineHeight: 1.25; whiteSpace: normal;`);
                }

                if (this.textGroup) {
                    const offset = data.textOffset;
                    this.textGroup.setAttribute('position', `${offset.x} ${offset.y} ${offset.z}`);
                }
            }
        });
    </script>
    <script>
        (function () {
            const baseScales = new WeakMap();

            const parseScale = (value) => {
                if (!value) {
                    return { x: 1, y: 1, z: 1 };
                }

                if (typeof value === 'object') {
                    const { x = 1, y = 1, z = 1 } = value;
                    return {
                        x: Number.isFinite(+x) ? +x : 1,
                        y: Number.isFinite(+y) ? +y : 1,
                        z: Number.isFinite(+z) ? +z : 1
                    };
                }

                if (typeof value === 'string') {
                    const [sx = '1', sy = '1', sz = '1'] = value.trim().split(/\s+/);
                    return {
                        x: Number.parseFloat(sx) || 1,
                        y: Number.parseFloat(sy) || 1,
                        z: Number.parseFloat(sz) || 1
                    };
                }

                return { x: 1, y: 1, z: 1 };
            };

            const captureBaseScale = (entity) => {
                if (baseScales.has(entity)) {
                    return baseScales.get(entity);
                }

                const scaleAttr = entity.getAttribute('scale');
                const scale = parseScale(scaleAttr);
                baseScales.set(entity, scale);
                return scale;
            };

            const computeScale = () => {
                const width = window.innerWidth || 1;
                const height = window.innerHeight || 1;
                const aspect = width / height;
                const shortestSide = Math.min(width, height);

                let widthBoost = 1.08;

                if (aspect < 0.9) {
                    widthBoost *= Math.min(1.2, 0.92 / Math.max(aspect, 0.55));
                } else if (aspect > 1.6) {
                    widthBoost *= 1.05;
                }

                let uniformFactor = 1;

                if (shortestSide <= 360) {
                    uniformFactor = 0.85;
                } else if (shortestSide <= 430) {
                    uniformFactor = 0.9;
                } else if (shortestSide <= 540) {
                    uniformFactor = 0.95;
                } else if (shortestSide <= 680) {
                    uniformFactor = 0.98;
                }

                return { widthBoost, uniformFactor };
            };

            const applyScale = () => {
                const { widthBoost, uniformFactor } = computeScale();
                const entities = document.querySelectorAll('a-entity[team-card]');

                entities.forEach((entity) => {
                    const base = captureBaseScale(entity);
                    const object3D = entity.object3D;

                    if (!object3D || !object3D.scale) {
                        return;
                    }

                    const scale = {
                        x: base.x * widthBoost * uniformFactor,
                        y: base.y * uniformFactor,
                        z: base.z * uniformFactor
                    };

                    object3D.scale.set(scale.x, scale.y, scale.z);
                    entity.setAttribute('scale', `${scale.x} ${scale.y} ${scale.z}`);
                });
            };

            const scheduleScale = () => {
                requestAnimationFrame(() => {
                    applyScale();
                    setTimeout(applyScale, 220);
                });
            };

            document.addEventListener('DOMContentLoaded', () => {
                const scene = document.querySelector('a-scene');

                if (scene) {
                    if (scene.hasLoaded) {
                        scheduleScale();
                    } else {
                        scene.addEventListener('loaded', scheduleScale, { once: true });
                    }
                } else {
                    scheduleScale();
                }
            });

            window.addEventListener('resize', scheduleScale);
            window.addEventListener('orientationchange', scheduleScale);
            document.addEventListener('camera-init', scheduleScale);
        })();
    </script>

                    resetTimer = null;
                }

                const profile = socialProfiles[personKey];
                if (!profile) {
                    return;
                }

                setPanelState({ title: profile.name, subtitle: null, links: profile.links });
                socialPanel.classList.add('visible');
                socialPanel.setAttribute('aria-hidden', 'false');
                currentPersonKey = personKey;
            };

            const hidePanel = () => {
                socialPanel.classList.remove('visible');
                socialPanel.setAttribute('aria-hidden', 'true');
                currentPersonKey = null;

                resetTimer = setTimeout(() => {
                    if (!socialPanel.classList.contains('visible')) {
                        setPanelState(defaultPanelState);
                    }
                    resetTimer = null;
                }, panelTransitionMs + 50);
            };

            document.querySelectorAll('a-marker[data-person]').forEach(marker => {
                const personKey = marker.dataset.person;

                marker.addEventListener('markerFound', () => {
                    activeMarkers.add(personKey);
                    showPanel(personKey);
                });

                marker.addEventListener('markerLost', () => {
                    activeMarkers.delete(personKey);

                    if (currentPersonKey === personKey) {
                        const nextPersonKey = Array.from(activeMarkers).pop();
                        if (nextPersonKey) {
                            showPanel(nextPersonKey);
                        } else {
                            hidePanel();
                        }
                    }
                });
            });
        });
    </script>
</body>
</html>

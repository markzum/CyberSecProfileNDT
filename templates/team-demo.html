<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Team Demo - CyberSec</title>
    <script src="https://aframe.io/releases/1.0.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }
        .info-panel {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: #00ff88;
            padding: 15px;
            border-radius: 10px;
            z-index: 999;
            max-width: 300px;
        }
        .info-panel h3 {
            margin: 0 0 10px 0;
        }
        .info-panel p {
            margin: 5px 0;
            font-size: 14px;
        }
        .info-panel a {
            color: #00ff88;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <h3>🎯 AR Demo</h3>
        <p>Наведите камеру на маркер Hiro</p>
        <p><a href="https://raw.githubusercontent.com/AR-js-org/AR.js/master/data/images/hiro.png" target="_blank">📥 Скачать маркер</a></p>
        <p style="font-size: 12px; color: #666; margin-top: 10px;">Разрешите доступ к камере</p>
    </div>

    <a-scene embedded arjs vr-mode-ui="enabled: false">
        <a-marker preset="hiro">
            <!-- Карточка члена команды -->
            <a-entity position="0 0 0">
                <!-- Фон -->
                <a-plane position="0 0.5 0" rotation="-90 0 0" width="1.5" height="2" color="#1a1a2e" material="opacity: 0.95"></a-plane>
                
                <!-- Рамка -->
                <a-plane position="0 0.51 0" rotation="-90 0 0" width="1.52" height="2.02" color="#00ff88" material="opacity: 0.8"></a-plane>
                
                <!-- Аватар -->
                <a-circle position="0 1.2 0.01" rotation="-90 0 0" radius="0.3" color="#00ff88"></a-circle>
                
                <!-- Имя -->
                <a-text value="Alex Cipher" position="-0.6 0.7 0.01" rotation="-90 0 0" color="#00ff88" width="1.5" align="center"></a-text>
                
                <!-- Должность -->
                <a-text value="CEO / Team Lead" position="-0.6 0.5 0.01" rotation="-90 0 0" color="#ffffff" width="1.5" scale="0.7 0.7 0.7" align="center"></a-text>
                
                <!-- Описание -->
                <a-text value="Penetration Testing Expert" position="-0.6 0.3 0.01" rotation="-90 0 0" color="#cccccc" width="1.3" scale="0.5 0.5 0.5" align="center"></a-text>
                <a-text value="CTF Champion 2024" position="-0.6 0.15 0.01" rotation="-90 0 0" color="#cccccc" width="1.3" scale="0.5 0.5 0.5" align="center"></a-text>
                <a-text value="OWASP Top 10 Specialist" position="-0.6 0.0 0.01" rotation="-90 0 0" color="#cccccc" width="1.3" scale="0.5 0.5 0.5" align="center"></a-text>
                
                <!-- Логотип DEMO -->
                <a-text value="DEMO MODE" position="-0.3 -0.3 0.01" rotation="-90 0 0" color="#ff6b6b" width="1.5" scale="0.6 0.6 0.6" align="center"></a-text>
            </a-entity>
        </a-marker>
        
        <a-entity camera></a-entity>
    </a-scene>
</body>
</html>
